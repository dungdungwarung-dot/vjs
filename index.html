<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VJS Finance - CV. VIA JAYA SINERGI</title>
<meta name="theme-color" content="#0f172a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="VJS Finance">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
  html, body { margin: 0; height: 100%; background: #ffffff; font-family: system-ui, sans-serif; }
  #app { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; background: #fff; }
  #splash {
    position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 18px; background: #ffffff; z-index: 10; transition: opacity .4s;
  }
  #splash img { height: 120px; }
  #splash p { margin: 0; color: #475569; font-size: 14px; }
  .spinner { width: 28px; height: 28px; border: 3px solid #e2e8f0; border-top-color: #0f172a;
    border-radius: 50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #offline { display: none; text-align: center; padding: 24px; }
  #offline button, #install {
    background: #0f172a; color: #fff; border: 0; border-radius: 10px; padding: 10px 18px;
    font-size: 14px; cursor: pointer;
  }
  #install { display: none; position: fixed; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom)); z-index: 20;
    box-shadow: 0 4px 14px rgba(0,0,0,.25); }
</style>
</head>
<body>
<div id="splash">
  <img src="icons/logo-splash.png" alt="Logo VJS">
  <div class="spinner" id="spin"></div>
  <p id="msg">Memuat aplikasi…</p>
  <div id="offline">
    <p>Tidak ada koneksi internet.<br>Aplikasi ini membutuhkan internet untuk mengakses data.</p><br>
    <button onclick="location.reload()">Coba lagi</button>
  </div>
</div>

<iframe id="app" title="Sistem Keuangan VJS" allow="clipboard-write; fullscreen; downloads"></iframe>
<button id="install">Instal Aplikasi</button>

<script>
  // ====== WAJIB DIISI: URL Web App Apps Script (yang berakhiran /exec) ======
  const GAS_URL = "https://script.google.com/macros/s/AKfycbwFHlMVE14hPKC40NgYqMQDEiaWN3ip64VYOrM50Tl1NLYBKdO67cRXsaHeqmDsp-l-/exec";
  // ==========================================================================

  const frame = document.getElementById('app');
  const splash = document.getElementById('splash');

  function hideSplash() {
    splash.style.opacity = 0;
    setTimeout(() => splash.style.display = 'none', 400);
  }
  function showOffline() {
    splash.style.display = 'flex'; splash.style.opacity = 1;
    document.getElementById('spin').style.display = 'none';
    document.getElementById('msg').style.display = 'none';
    document.getElementById('offline').style.display = 'block';
  }
  function load() {
    if (!navigator.onLine) return showOffline();
    if (GAS_URL.indexOf('GANTI_DENGAN') === 0) {
      document.getElementById('msg').textContent = 'URL Apps Script belum diisi di index.html';
      document.getElementById('spin').style.display = 'none';
      return;
    }
    frame.addEventListener('load', hideSplash, { once: true });
    frame.src = GAS_URL;
    setTimeout(hideSplash, 15000); // jaga-jaga bila event load tidak terpicu
  }
  window.addEventListener('offline', showOffline);
  window.addEventListener('online', () => location.reload());
  load();

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(console.warn));
  }

  // Tombol instal manual (muncul hanya di browser, bukan setelah terinstal)
  let deferred;
  const btn = document.getElementById('install');
  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault(); deferred = e; btn.style.display = 'block';
  });
  btn.addEventListener('click', async () => {
    if (!deferred) return;
    deferred.prompt(); await deferred.userChoice; deferred = null; btn.style.display = 'none';
  });
  window.addEventListener('appinstalled', () => { btn.style.display = 'none'; });
</script>
</body>
</html>
